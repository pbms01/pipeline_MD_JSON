[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-md-json"
version = "3.0.0"
description = "Pipeline Hibrido v3 para conversao de documentos PDF/DOCX em Markdown e JSON estruturado"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.39.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.scripts]
pipeline-server = "run:main"
pipeline-cli = "cli:main"

[tool.setuptools.packages.find]
include = ["converter*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
